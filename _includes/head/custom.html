<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch (e) {}
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  document.body.classList.add('accent-border-top');
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) { if (entry.isIntersecting) entry.target.classList.add('animate'); });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    document.querySelectorAll('.paper-box, .highlight-block').forEach(function(el) {
      el.classList.add('fade-in-up');
      observer.observe(el);
    });
  }
  document.querySelectorAll('a[href*="pdf"], a[href*="github"], a[href*="arxiv"]').forEach(function(link) {
    link.classList.add('link-accent');
  });
});
</script>
